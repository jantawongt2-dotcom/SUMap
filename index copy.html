<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SU MAP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- ปรับ path ให้ตรงกับที่วางไฟล์จริง -->
    <link rel="stylesheet" href="../../style_copy.css">
</head>

<!-- เปลี่ยนแค่ data-category ในแต่ละหมวด: toilet / gym / atm / common / canteen -->
<body data-category="toilet">

    <!-- ========== SECTION 1: หน้า CATEGORY ========== -->
    <div id="category-page-section">

        <!-- [MOBILE] -->
        <header class="d-block d-sm-none position-relative mb-3">
            <div class="custom-radius-25 d-flex align-items-center justify-content-between px-3 bg-white" style="height: 52px; border: 1px solid var(--color-primary);">
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn-back btn btn-link p-0 text-dark border-0 d-flex align-items-center">
                        <i class="bi bi-chevron-left font-title" style="font-size: 20px;"></i>
                    </button>
                    <h1 class="font-title mb-0" style="font-size: 20px;" data-bind="category-title"></h1>
                </div>
                <div class="font-medium small fw-normal" data-bind="category-count"></div>
            </div>
        </header>

        <!-- [DESKTOP & IPAD] -->
        <header class="desktop-top-header-container d-none d-sm-block">
            <div class="desktop-top-header-box custom-radius-25 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn-back btn btn-link p-0 text-dark border-0 d-flex align-items-center me-2">
                        <i class="bi bi-chevron-left font-title"></i>
                    </button>
                    <h1 class="font-title mb-0" data-bind="category-title"></h1>
                </div>
                <div class="font-medium" data-bind="category-count"></div>
            </div>
        </header>

        <!-- การ์ดอาคาร: JS สร้างให้ -->
        <main class="main-page-container">
            <div class="row g-3 g-md-4" id="category-list"></div>
        </main>
    </div>

    <!-- ========== SECTION 2: หน้า LOCATION ========== -->
    <div id="location-page-section" style="display: none;">

        <!-- [MOBILE] HERO -->
        <header class="mobile-hero-header d-block d-md-none position-relative">
            <img src="" alt="" class="w-100 h-100 object-fit-cover" data-bind="building-hero">
            <div class="mobile-floating-header custom-radius-25 d-flex align-items-center justify-content-between px-3 bg-white">
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn-back btn btn-link p-0 text-dark border-0 d-flex align-items-center"><i class="bi bi-chevron-left font-title"></i></button>
                    <h1 class="font-title mb-0" data-bind="category-title"></h1>
                </div>
                <div class="font-medium small" data-bind="category-count"></div>
            </div>
        </header>

        <!-- [DESKTOP & IPAD] -->
        <header class="desktop-top-header-container d-none d-sm-block">
            <div class="desktop-top-header-box custom-radius-25 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn-back btn btn-link p-0 text-dark border-0 d-flex align-items-center me-2"><i class="bi bi-chevron-left font-title"></i></button>
                    <h1 class="font-title mb-0" data-bind="category-title"></h1>
                </div>
                <div class="font-medium" data-bind="category-count"></div>
            </div>
        </header>

        <main class="main-page-container">
            <div class="desktop-building-title-section d-none d-lg-block">
                <h2 class="font-building mb-0 d-flex align-items-center gap-2">
                    <img src="../../img/location.svg" class="icon-location-svg" alt="">
                    <span data-bind="building-name"></span>
                </h2>
            </div>

            <div class="row main-content-layout g-3 g-lg-4">
                <div class="col-12 col-lg-6 d-none d-sm-block">
                    <div class="main-building-img-box custom-radius-25 overflow-hidden position-relative">
                        <img src="" alt="" class="img-fluid w-100 h-100 object-fit-cover" data-bind="building-hero">
                        <div class="ipad-img-overlay d-none d-sm-flex d-lg-none flex-column align-items-start justify-content-end text-start text-white">
                            <div class="d-flex align-items-start gap-2 mb-3">
                                <img src="../../img/location.svg" class="icon-location-svg pin-icon-white mt-1" alt="">
                                <div class="d-flex flex-column align-items-start">
                                    <h2 class="font-building text-white fw-bold mb-1" data-bind="building-name"></h2>
                                    <div class="small text-white-50" data-bind="building-sub"></div>
                                </div>
                            </div>
                            <span class="badge bg-white text-dark custom-radius-25 px-4 py-2 font-medium border border-dark fw-normal" data-bind="building-time"></span>
                        </div>
                    </div>
                </div>

                <!-- [MOBILE] ข้อมูลอาคาร -->
                <div class="col-12 d-sm-none mobile-building-info">
                    <div class="d-flex align-items-start gap-2 mb-1">
                        <img src="../../img/location.svg" class="mobile-icon-location-svg mt-1" alt="">
                        <div class="d-flex flex-column align-items-start">
                            <h2 class="mobile-font-building-title mb-1" data-bind="building-name"></h2>
                            <div class="mobile-font-sub-title mb-2" data-bind="building-sub"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <span class="mobile-badge-time custom-radius-25 d-inline-flex align-items-center px-3 py-1" data-bind="building-time"></span>
                    </div>
                </div>

                <div class="col-12 ipad-section-title mt-3 mb-1">
                    <div class="d-flex justify-content-between align-items-center px-1">
                        <h5 class="mobile-font-section-title mb-0 fw-bold" data-bind="floor-heading"></h5>
                        <span class="mobile-font-section-title fw-bold" data-bind="floor-count"></span>
                    </div>
                </div>

                <!-- การ์ดชั้น/พื้นที่: JS สร้างให้ -->
                <div class="col-12 col-lg-6 d-flex flex-column justify-content-start gap-3" id="location-floors"></div>
            </div>

            <!-- แกลเลอรี: JS สร้างให้ -->
            <div class="row g-2 g-md-3 gallery-layout mobile-gallery-scroll mt-2" id="location-gallery"></div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="footer-wrapper">
        <div class="footer-top text-white d-none d-sm-block">
            <div class="footer-container-fluid">
                <div class="footer-flex-row">
                    <div class="footer-col-brand"><h3 class="footer-SUMap mb-0">SU MAP</h3></div>
                    <div class="footer-col-info">
                        <div class="footer-section-dev">
                            <h6>ผู้พัฒนาระบบ</h6>
                            <p>นักศึกษาคณะเทคโนโลยีสารสนเทศ<br>และการสื่อสารดิจิทัล มหาวิทยาลัยศิลปากร</p>
                        </div>
                        <div class="footer-section-about">
                            <h6>เกี่ยวกับโครงการ</h6>
                            <p>ระบบแผนที่ดิจิทัลและนำทาง</p>
                            <p>ภายในมหาวิทยาลัย</p>
                            <p>IG : @sumap_official</p>
                            <p>LINE : @sumap</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer-bottom text-white d-flex align-items-center justify-content-center">
            <div class="font-footer-regular text-center">© 2026 SUMap.com. All rights reserved.</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ปรับ path/ชื่อไฟล์ให้ตรงกับที่วางไฟล์จริง -->
    <script src="../script copy.js"></script>
</body>
</html>
